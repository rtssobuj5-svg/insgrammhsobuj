<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2A2620">
<link rel="manifest" href="/manifest.json">
<title>Growth Ledger — 100-Day Growth &amp; $1,000 Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GROWTH LEDGER — design tokens
   Palette pulled from the shipped PWA manifest (#2A2620) and
   extended into a leather-ledger / brass-ink system.
   ============================================================ */
:root{
  --bg: #1C1814;
  --bg-1: #2A2620;      /* manifest theme/background color */
  --bg-2: #332D25;
  --bg-3: #3C352B;
  --border: #4A4033;
  --border-soft: #3A332A;
  --ink: #F1E9DA;
  --ink-dim: #B4A890;
  --ink-faint: #8B8071;
  --gold: #C7A544;
  --gold-bright: #E8C965;
  --gold-dim: #8A7431;
  --danger: #C1584A;
  --danger-bg: #3A2620;
  --success: #7C9A5D;

  --fishing: #4E90A8;
  --fishing-soft: rgba(78,144,168,.14);
  --terrier: #C97C4A;
  --terrier-soft: rgba(201,124,74,.14);
  --cows: #7C9A52;
  --cows-soft: rgba(124,154,82,.14);

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -8px rgba(0,0,0,.5);
}

/* ---------- Light theme (toggled via <html data-theme="light">) ---------- */
:root[data-theme="light"]{
  --bg: #F5F0E6;
  --bg-1: #EDE6D6;
  --bg-2: #E4DCC8;
  --bg-3: #D9CFB8;
  --border: #C9BC9E;
  --border-soft: #D9CFB8;
  --ink: #2A2620;
  --ink-dim: #5C5344;
  --ink-faint: #8B8071;
  --gold: #8A7431;
  --gold-bright: #6B5A22;
  --gold-dim: #A88F3F;
  --danger: #A8402F;
  --danger-bg: #F3DCD5;
  --success: #4C6A32;

  --fishing: #2E627A;
  --fishing-soft: rgba(46,98,122,.10);
  --terrier: #965328;
  --terrier-soft: rgba(150,83,40,.10);
  --cows: #4C6A32;
  --cows-soft: rgba(76,106,50,.10);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(199,165,68,.06), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* subtle paper-grain overlay */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.035; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

a{color:var(--gold-bright);}

/* ---------- layout shell ---------- */
.shell{max-width:960px; margin:0 auto; padding:28px 20px 80px; position:relative; z-index:1;}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:26px;
}
.wordmark{display:flex; align-items:baseline; gap:10px;}
.topbar-actions{ display:flex; align-items:center; gap:10px; }
.wordmark .mark{
  font-family:var(--font-display); font-style:italic; font-weight:600;
  font-size:26px; letter-spacing:.2px; color:var(--ink);
}
.wordmark .sub{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--gold-dim);
}
.icon-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border); background:var(--bg-2);
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s ease; font-size:16px;
}
.icon-btn:hover{ color:var(--gold-bright); border-color:var(--gold-dim); background:var(--bg-3);}
.icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--gold-bright); outline-offset:2px;
}

/* ---------- ledger tab strip ---------- */
.tabstrip{ display:flex; gap:6px; margin-bottom:22px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.tab{
  --accent: var(--gold);
  position:relative;
  font-family:var(--font-display); font-weight:600; font-size:15px;
  padding:11px 22px 13px; cursor:pointer; user-select:none;
  color:var(--ink-faint); background:transparent; border:none;
  clip-path:polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  transition:.15s ease;
  display:flex; align-items:center; gap:8px;
}
.tab .emoji{font-size:15px; filter:grayscale(1); opacity:.5; transition:.15s ease;}
.tab[data-active="true"]{
  color:var(--ink); background:var(--bg-2);
}
.tab[data-active="true"] .emoji{ filter:none; opacity:1;}
.tab[data-active="true"]::after{
  content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px;
  background:var(--accent);
}
.tab[data-niche="fishing"]{ --accent: var(--fishing); }
.tab[data-niche="terrier"]{ --accent: var(--terrier); }
.tab[data-niche="cows"]{ --accent: var(--cows); }
.tab:hover:not([data-active="true"]){ color:var(--ink-dim); }

.niche-panel{ display:none; }
.niche-panel[data-visible="true"]{ display:block; animation: fade-in .25s ease; }
@keyframes fade-in{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }

/* ---------- generic card ---------- */
.card{
  background:var(--bg-1);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  margin-bottom:20px;
  overflow:hidden;
}
.card-body{ padding:20px 22px; }
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px; gap:12px;
}
.section-title{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--ink);
}
.section-title .ledger-no{
  font-family:var(--font-mono); font-size:11px; color:var(--gold-dim);
  border:1px solid var(--border); border-radius:4px; padding:2px 6px;
}
.section-sub{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }

/* ---------- daily log ---------- */
.log-form{ display:grid; grid-template-columns:150px 1fr 120px; gap:10px; margin-bottom:16px;}
@media (max-width:640px){ .log-form{ grid-template-columns:1fr; } }

.filter-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin:14px 0; }
.filter-row > div{ min-width:150px; }
.filter-row input[type="date"]{ margin-bottom:0; }

.challenge-startform{ display:grid; grid-template-columns:180px 1fr; gap:10px; margin-bottom:6px; align-items:end; }
@media (max-width:640px){ .challenge-startform{ grid-template-columns:1fr; } }

.challenge-entryform{ display:grid; grid-template-columns:120px repeat(5, 1fr); gap:10px; margin-bottom:4px; }
@media (max-width:760px){ .challenge-entryform{ grid-template-columns:1fr 1fr 1fr; } }
@media (max-width:420px){ .challenge-entryform{ grid-template-columns:1fr 1fr; } }

.progress-track{ width:100%; height:10px; border-radius:999px; background:var(--bg-3); overflow:hidden; margin:14px 0 4px; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); border-radius:999px; transition:width .3s ease; }

.challenge-badges{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.challenge-badge{
  background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:10px 14px; min-width:104px; flex:1 1 104px;
}
.challenge-badge .num{ font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--gold-bright); line-height:1.1; }
.challenge-badge .lbl{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }

.target-pill{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
  font-family:var(--font-mono); font-size:10.5px; font-weight:600; white-space:nowrap;
}
.target-pill.hit{ background:rgba(124,154,93,.16); color:var(--success); }
.target-pill.miss{ background:rgba(193,88,74,.14); color:var(--danger); }
label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:6px; }
input[type="text"], input[type="date"], input[type="number"], input[type="url"], textarea, select{
  width:100%; background:var(--bg-2); border:1px solid var(--border);
  color:var(--ink); border-radius:var(--radius-sm); padding:9px 11px;
  font-family:var(--font-body); font-size:14px; transition:.15s ease;
}
input::placeholder, textarea::placeholder{ color:var(--ink-faint); }
input:focus, textarea:focus, select:focus{ border-color:var(--gold-dim); background:var(--bg-3); }
textarea{ resize:vertical; min-height:56px; font-family:var(--font-body); line-height:1.5; }

.btn{
  font-family:var(--font-body); font-weight:600; font-size:13.5px;
  border-radius:var(--radius-sm); padding:9px 16px; cursor:pointer;
  border:1px solid transparent; transition:.15s ease; display:inline-flex; align-items:center; gap:7px;
  white-space:nowrap;
}
.btn-gold{ background:var(--gold); color:#231D12; }
.btn-gold:hover{ background:var(--gold-bright); }
.btn-gold:disabled{ background:var(--bg-3); color:var(--ink-faint); cursor:not-allowed; }
.btn-ghost{ background:transparent; border-color:var(--border); color:var(--ink-dim); }
.btn-ghost:hover{ border-color:var(--gold-dim); color:var(--ink); }
.btn-danger{ background:var(--danger); color:#fff; }
.btn-danger:hover{ filter:brightness(1.08); }
.btn-sm{ padding:6px 11px; font-size:12.5px; }
.btn:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

.log-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.log-table thead th{
  text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid var(--border-soft);
  padding:0 8px 8px;
}
.log-table tbody tr{ border-bottom:1px dashed var(--border-soft); }
.log-table tbody tr:last-child{ border-bottom:none; }
.log-table td{ padding:9px 8px; vertical-align:top; }
.log-table td.no{ font-family:var(--font-mono); color:var(--gold-dim); white-space:nowrap; }
.log-table td.date{ font-family:var(--font-mono); color:var(--ink-dim); white-space:nowrap; }
.log-empty{ padding:18px 4px; color:var(--ink-faint); font-size:13px; font-style:italic; }

/* ---------- collapsible AI helper ---------- */
.helper-toggle{
  width:100%; background:none; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px; text-align:left;
}
.helper-toggle .chev{
  transition:transform .2s ease; color:var(--gold-dim); font-size:13px;
}
.helper-toggle[aria-expanded="true"] .chev{ transform:rotate(90deg); }
.helper-body{ display:none; padding:0 22px 22px; }
.helper-body[data-open="true"]{ display:block; }

.upload-zone{
  border:1.5px dashed var(--border);
  border-radius:var(--radius-md);
  padding:22px; text-align:center; cursor:pointer;
  transition:.15s ease; background:var(--bg-2);
}
.upload-zone:hover, .upload-zone.drag{ border-color:var(--gold-dim); background:var(--bg-3); }
.upload-zone .up-icon{ font-size:22px; margin-bottom:6px; opacity:.8; }
.upload-zone .up-text{ font-size:13.5px; color:var(--ink-dim); }
.upload-zone .up-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
.upload-zone input[type="file"]{ display:none; }

.preview-row{ display:flex; align-items:center; gap:14px; margin-top:14px; }
.batch-nav{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:12px; font-size:12.5px; color:var(--ink-dim); font-family:var(--font-mono);
}
.preview-thumb{
  width:74px; height:74px; border-radius:var(--radius-sm); object-fit:cover;
  border:1px solid var(--border); background:var(--bg-2); flex-shrink:0;
}
.preview-meta{ flex:1; min-width:0; }
.preview-name{ font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.preview-type{ font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); margin-top:2px; }

.gen-row{ display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }

.state-box{
  margin-top:16px; padding:16px; border-radius:var(--radius-md);
  border:1px solid var(--border-soft); background:var(--bg-2);
  display:flex; align-items:center; gap:12px; font-size:13.5px; color:var(--ink-dim);
}
.state-box.error{ border-color:#5A342C; background:var(--danger-bg); color:#E8B8AE; }
.spinner{
  width:16px; height:16px; border-radius:50%;
  border:2px solid var(--border); border-top-color:var(--gold-bright);
  animation:spin .7s linear infinite; flex-shrink:0;
}
@keyframes spin{ to{ transform:rotate(360deg);} }
.loader3d-wrap{
  width:64px; height:64px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.loader3d-wrap canvas{ display:block; }
.follower-chart-wrap{ position:relative; width:100%; height:200px; }
.follower-chart-wrap canvas{ width:100% !important; height:100% !important; }

/* platform stamp tabs */
.platform-tabs{ display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; }
.platform-tab{
  display:flex; align-items:center; gap:7px;
  border:1px solid var(--border); background:var(--bg-2); color:var(--ink-dim);
  border-radius:999px; padding:6px 12px 6px 6px; cursor:pointer; font-size:12.5px; font-weight:600;
  transition:.15s ease;
}
.platform-tab .stamp{
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:9.5px; font-weight:700;
  border:1.5px solid var(--gold-dim); color:var(--gold-dim); transform:rotate(-6deg);
}
.platform-tab[data-active="true"]{ border-color:var(--gold-dim); color:var(--ink); background:var(--bg-3); }
.platform-tab[data-active="true"] .stamp{ background:var(--gold); color:#231D12; border-color:var(--gold); }
.platform-tab:hover{ color:var(--ink); }

.platform-panel{ display:none; margin-top:16px; }
.platform-panel[data-visible="true"]{ display:block; animation:fade-in .2s ease; }

.field{ margin-bottom:14px; }
.field-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.char-count{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }

.video-note{
  display:flex; align-items:center; gap:7px; font-size:12px; color:var(--gold-dim);
  margin-top:2px; margin-bottom:14px; font-style:italic;
}

.copy-row{ display:flex; gap:10px; margin-top:6px; }

hr.divider{ border:none; border-top:1px solid var(--border-soft); margin:22px 0; }

.credit-block{
  background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:14px 16px; margin-top:10px; font-size:13.5px; line-height:1.6; color:var(--ink-dim);
  font-style:italic;
}
.credit-block strong{ color:var(--ink); font-style:normal; }

/* ---------- account tracker ---------- */
.acct-form{ display:grid; grid-template-columns:140px 1.4fr 1fr 110px; gap:10px; align-items:end; }
@media (max-width:640px){ .acct-form{ grid-template-columns:1fr; } }

.bulk-import{ margin-top:12px; }
.bulk-import summary{
  cursor:pointer; font-size:12.5px; color:var(--ink-dim); font-weight:600;
  padding:4px 0; user-select:none;
}
.bulk-import summary:hover{ color:var(--gold-bright); }
.bulk-import textarea{ font-family:var(--font-mono); font-size:12.5px; }
.acct-stats{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin:16px 0 12px; flex-wrap:wrap;
}
.acct-count{ font-size:12.5px; color:var(--ink-dim); }
.acct-count strong{ color:var(--gold-bright); font-family:var(--font-mono); }
.acct-sort{ display:flex; align-items:center; gap:8px; }
.acct-sort label{ margin:0; white-space:nowrap; }
.acct-sort select{ width:auto; padding:6px 10px; font-size:12.5px; }

.uname-quickadd{ display:flex; gap:8px; margin-bottom:12px; }
.uname-quickadd input{ flex:1; }
.uname-list{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
.uname-pill{
  display:flex; align-items:stretch; border:1px solid var(--border);
  background:var(--bg-2); border-radius:999px; overflow:hidden;
  transition:.15s ease;
}
.uname-pill[data-active="true"]{ border-color:var(--gold-dim); background:var(--bg-3); }
.uname-pill-main{
  display:flex; align-items:center; gap:6px; background:none; border:none;
  color:var(--ink-dim); font-family:var(--font-mono); font-size:12px; font-weight:600;
  padding:7px 4px 7px 13px; cursor:pointer;
}
.uname-pill[data-active="true"] .uname-pill-main{ color:var(--gold-bright); }
.uname-pill-main:hover{ color:var(--ink); }
.uname-pill-count{
  font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);
  background:var(--bg); border-radius:999px; padding:1px 6px;
}
.uname-pill[data-active="true"] .uname-pill-count{ color:var(--gold-dim); }
.uname-pill-copy{
  border:none; border-left:1px solid var(--border-soft); background:none;
  color:var(--ink-faint); cursor:pointer; padding:7px 11px; font-size:12px;
  display:flex; align-items:center; transition:.15s ease;
}
.uname-pill-copy:hover{ color:var(--gold-bright); background:var(--bg-3); }

.acct-filter-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-dim); margin:2px 0 12px;
  background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:8px 12px;
}
.acct-filter-bar strong{ color:var(--gold-bright); font-family:var(--font-mono); }

.acct-list{ display:flex; flex-direction:column; gap:8px; }
.acct-row{
  display:flex; align-items:center; gap:12px;
  border:1px solid var(--border-soft); background:var(--bg-2);
  border-radius:var(--radius-md); padding:10px 12px;
  transition:.15s ease;
}
.acct-row[data-done="true"]{ opacity:.55; background:transparent; border-style:dashed; }
.acct-row-main{ flex:1; min-width:0; }
.acct-row-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.acct-username{ font-family:var(--font-mono); font-weight:600; font-size:13.5px; color:var(--ink); }
.acct-row[data-done="true"] .acct-username{ text-decoration:line-through; color:var(--ink-faint); }
.acct-date{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
.acct-link{
  font-size:11.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; display:block; margin-top:3px; max-width:100%;
}
.acct-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.acct-icon-btn{
  width:30px; height:30px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--bg-3); color:var(--ink-dim); cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:12.5px; transition:.15s ease; flex-shrink:0;
}
.acct-icon-btn:hover{ color:var(--gold-bright); border-color:var(--gold-dim); }
.done-pill{
  border:1px solid var(--border); background:var(--bg-3); color:var(--ink-dim);
  border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; gap:6px; transition:.15s ease; flex-shrink:0; white-space:nowrap;
}
.done-pill[data-done="true"]{ background:var(--success); border-color:var(--success); color:#16240F; }
.done-pill:hover{ border-color:var(--gold-dim); }

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(12px);
  background:var(--bg-3); border:1px solid var(--gold-dim); color:var(--ink);
  padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;

  try{ localStorage.setItem("remindersEnabled", v ? "1" : "0"); }catch(e){}

function maybeShowDailyReminder(){
  if(!getRemindersEnabled()) return;
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;

  const today = todayISO();
  let lastShown = null;
  try{ lastShown = localStorage.getItem("lastReminderDate"); }catch(e){}
  if(lastShown === today) return; // already reminded today

  const start = state.challenge.startDate;
  const day = start ? dayNumberFor(today, start) : null;
  const hasLoggedToday = state.challenge.entries.some(e => e.date === today);

}

/* ============================================================
   CSV export — used by every "Export CSV" button across the app.
   Builds a CSV client-side and triggers a browser download; no
   server round-trip, no extra library needed.
   ============================================================ */
function exportCSV(filename, headers, rows){
  const esc = (v)=>{
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(esc).join(",")].concat(rows.map(r => r.map(esc).join(",")));
  const csv = "\uFEFF" + lines.join("\r\n"); // BOM so Excel opens UTF-8 correctly
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   RESPONSE SCHEMA — structured JSON output for all 5 platforms
   ============================================================ */
function platformSchema(){
  return {
    type:"OBJECT",
    properties:{
      title:{ type:"STRING" },
      description:{ type:"STRING" },
      hashtags:{ type:"ARRAY", items:{ type:"STRING" } }
    },
    required:["title","description","hashtags"]
  };
}
function buildResponseSchema(){
  const props = {};
  PLATFORMS.forEach(p => props[p.key] = platformSchema());
  return { type:"OBJECT", properties:props, required:PLATFORMS.map(p=>p.key) };
}

function buildPrompt(nicheStyleName){
  return `You are a social media assistant for a ${nicheStyleName} content creator.
Look at the attached image and write platform-tailored post copy for FIVE platforms: Instagram, a Facebook Page, a Facebook Group, X (Twitter), and Pinterest.

For EACH platform return:
- "title": a short catchy title, maximum 8 words.
- "description": a 1-2 sentence caption suited to that platform's tone and length norms (Instagram: punchy and visual; Facebook Page: brand-friendly and welcoming; Facebook Group: warm, community/conversation-starting tone; X: brief and punchy, fits a short post; Pinterest: descriptive and keyword-rich since Pinterest captions double as search text). All must match ${nicheStyleName} content and stay accurate to what is actually visible in the image.
- "hashtags": an array of 8-12 relevant hashtags for that platform, mixing broad and niche-specific tags, all lowercase, no duplicates, and WITHOUT the "#" symbol (just the word, e.g. "fishing" not "#fishing").

Return ONLY the JSON object matching the provided schema, with one key per platform: instagram, facebook_page, facebook_group, x, pinterest.`;
}

/* ============================================================
   Backend call — replaces the old direct-to-Gemini fetch.
   Sends the image + prompt + schema to our own /api/generate
   endpoint, which holds the Gemini API keys server-side and
   rotates between them (up to 5) so we get more effective quota.
   ============================================================ */
async function callGeminiForCaption(base64Data, mimeType, nicheStyleName){
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      base64Data,
      mimeType,
      prompt: buildPrompt(nicheStyleName),
      responseSchema: buildResponseSchema()
    })
  });

  if(!response.ok){
    const j = await response.json().catch(()=>({}));
    throw new Error(j?.error || `Server error (${response.status})`);
  }

  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text) throw new Error("Gemini returned an empty response.");

  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ throw new Error("Could not parse Gemini's response as JSON."); }

  PLATFORMS.forEach(p=>{
    if(!parsed[p.key]) parsed[p.key] = { title:"", description:"", hashtags:[] };
    if(!Array.isArray(parsed[p.key].hashtags)) parsed[p.key].hashtags = [];
  });
  return parsed;
}

/* ============================================================
   Media helpers — file -> base64, video -> frame
   ============================================================ */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Could not read the file."));
    reader.readAsDataURL(file);
  });
}

function extractVideoFrame(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.preload = "metadata";
    video.muted = true;
    video.playsInline = true;
    video.src = url;

    const cleanup = () => { URL.revokeObjectURL(url); };

    video.onloadedmetadata = () => {
      const seekTo = video.duration && video.duration > 1 ? 1 : Math.min(0.1, (video.duration || 0.2) / 2);
      video.currentTime = seekTo;
    };
    video.onseeked = () => {
      try{
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
        cleanup();
        resolve({ dataUrl, base64: dataUrl.split(",")[1], mimeType:"image/jpeg" });
      }catch(e){
        cleanup();
        reject(new Error("Could not extract a frame from that video."));
      }
    };
    video.onerror = () => { cleanup(); reject(new Error("Could not load that video file.")); };
  });
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function formatBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/(1024*1024)).toFixed(1) + " MB";
}

  return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e2){}
    document.body.removeChild(ta);
    return true;
  }
}

/* ============================================================
   Credit line generator (plain string interpolation, no AI)
   ============================================================ */
function parseUsernameFromUrl(raw){
  if(!raw) return "";
  let s = raw.trim();
  if(!s) return "";
  try{
    if(!/^https?:\/\//i.test(s)) s = "https://" + s;
    const u = new URL(s);
    let segs = u.pathname.split("/").filter(Boolean);
    let last = segs.length ? segs[segs.length-1] : "";
    last = last.split("?")[0].split("#")[0];
    last = last.replace(/^@/, "").replace(/\/+$/,"").trim();
    return last;
  }catch(e){
    // not a valid URL — treat raw input as a possible bare username/handle
    let last = s.replace(/\/+$/,"");
    last = last.split("/").pop() || "";
    last = last.split("?")[0].replace(/^@/, "").trim();
    return last;
  }
}
function creditLineFor(username){
  if(!username) return "";
  return `This image/video belongs to @${username}. If you'd like it edited or removed, please DM me.`;
}

/* ============================================================
   100-Day Challenge tab — Phase 1 (Day 1-7): 16 posts/day.
   Phase 2 (Day 8-100): 2 reels + 2 posts + 1 story/day.
   Also logs daily follow/unfollow counts. Start date lives in
   localStorage (a per-device setting); entries sync via Supabase.
   ============================================================ */
function addDaysISO(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function computeChallengeStats(){
  const s = state.challenge;
  const start = s.startDate;
  const todayDay = start ? dayNumberFor(todayISO(), start) : null;

  const byDate = {};
  s.entries.forEach(e=>{
    if(!byDate[e.date]) byDate[e.date] = { posts:0, reels:0, stories:0, follows:0, unfollows:0 };
    byDate[e.date].posts += e.posts;
    byDate[e.date].reels += e.reels;
    byDate[e.date].stories += e.stories;
    byDate[e.date].follows += e.follows;
    byDate[e.date].unfollows += e.unfollows;
  });

  let totalPosts=0, totalReels=0, totalStories=0, totalFollows=0, totalUnfollows=0;
  Object.values(byDate).forEach(d=>{
    totalPosts+=d.posts; totalReels+=d.reels; totalStories+=d.stories;
    totalFollows+=d.follows; totalUnfollows+=d.unfollows;
  });

  let streak = 0;
  if(start){
    const maxCheck = todayDay ? Math.max(0, Math.min(todayDay, 100)) : 0;
    for(let d=1; d<=maxCheck; d++){
      const dateISO = addDaysISO(start, d-1);
      const rec = byDate[dateISO];
      const target = challengeTargetForDay(d);
      const met = rec && rec.posts>=target.posts && rec.reels>=target.reels && rec.stories>=target.stories;
      if(met) streak++; else break;
    }
  }

  return {
    todayDay, totalPosts, totalReels, totalStories, totalFollows, totalUnfollows,
    netFollows: totalFollows - totalUnfollows,
    daysLogged: Object.keys(byDate).length,
    streak, byDate
  };
}

function renderChallengeSummary(){
  const el = document.getElementById("challenge-summary");
  if(!el) return;
  const s = state.challenge;
  const stats = computeChallengeStats();

  if(!s.startDate){
    el.innerHTML = `<div class="section-sub" style="margin-top:12px;">Set a start date above to begin tracking Day 1 of 100.</div>`;
    return;
  }

  const day = stats.todayDay;
  const dayClamped = (day === null) ? null : Math.max(1, Math.min(day, 100));
  const pct = dayClamped ? Math.round((dayClamped/100)*100) : 0;

  let statusLine = "";
  if(day !== null){
    if(day < 1) statusLine = `Challenge starts in ${1-day} day(s).`;
    else if(day > 100) statusLine = `🎉 100-day challenge complete!`;
    else {
      const target = challengeTargetForDay(day);
      statusLine = `Today is <strong>Day ${day} of 100</strong> — ${escapeHtml(target.phaseLabel)}`;
    }
  }

  el.innerHTML = `
    ${statusLine ? `<div class="section-sub" style="margin-top:12px; color:var(--ink);">${statusLine}</div>` : ""}
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="challenge-badges">
      <div class="challenge-badge"><div class="num">${stats.streak}</div><div class="lbl">Day streak 🔥</div></div>
      <div class="challenge-badge"><div class="num">${stats.totalPosts}</div><div class="lbl">Total posts</div></div>
      <div class="challenge-badge"><div class="num">${stats.totalReels}</div><div class="lbl">Total reels</div></div>
      <div class="challenge-badge"><div class="num">${stats.totalStories}</div><div class="lbl">Total stories</div></div>
      <div class="challenge-badge"><div class="num">${stats.totalFollows}</div><div class="lbl">Total follows</div></div>
      <div class="challenge-badge"><div class="num">${stats.totalUnfollows}</div><div class="lbl">Total unfollows</div></div>
      <div class="challenge-badge"><div class="num">${stats.netFollows>=0?"+":""}${stats.netFollows}</div><div class="lbl">Net follows</div></div>
    </div>
  `;
}

function wireChallengePanel(){
  document.getElementById("challenge-savestart")?.addEventListener("click", ()=>{
    const val = document.getElementById("challenge-startdate").value;
    if(!val){ showToast("Pick a start date first"); return; }
    state.challenge.startDate = val;
    setChallengeStartDate(val);
    renderChallengeAll();
    showToast("Start date saved");
  });

  document.getElementById("remindertoggle")?.addEventListener("change", async (e)=>{
    if(e.target.checked){
      if(typeof Notification === "undefined"){
        showToast("Notifications aren't supported in this browser");
        e.target.checked = false;
        return;
      }
      const perm = await Notification.requestPermission();
      if(perm !== "granted"){
        showToast("Notification permission was not granted");
        e.target.checked = false;
        return;
      }
      setRemindersEnabled(true);
      showToast("Reminder on — keep this tab open");
      maybeShowDailyReminder();
    }else{
      setRemindersEnabled(false);
    }
  });

  document.getElementById("challenge-addentry")?.addEventListener("click", async ()=>{
    const date = document.getElementById("challenge-date").value || todayISO();
    const posts = parseInt(document.getElementById("challenge-posts").value, 10) || 0;
    const reels = parseInt(document.getElementById("challenge-reels").value, 10) || 0;
    const stories = parseInt(document.getElementById("challenge-stories").value, 10) || 0;
    const follows = parseInt(document.getElementById("challenge-follows").value, 10) || 0;
    const unfollows = parseInt(document.getElementById("challenge-unfollows").value, 10) || 0;

    const btn = document.getElementById("challenge-addentry");
    btn.disabled = true;
    try{
      const entry = await addChallengeEntryToDB({ date, posts, reels, stories, follows, unfollows });
      state.challenge.entries.push(entry);
      renderChallengeAll();
      showToast("Entry added");
      ["challenge-posts","challenge-reels","challenge-stories","challenge-follows","challenge-unfollows"].forEach(id=>{
        const inp = document.getElementById(id);
        if(inp) inp.value = 0;
      });
    }catch(e){
      showToast("Couldn't save entry — check Supabase table setup");
      console.error(e);
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById("earnings-add")?.addEventListener("click", async ()=>{
    const date = document.getElementById("earnings-date").value || todayISO();
    const amount = parseFloat(document.getElementById("earnings-amount").value) || 0;
    const note = document.getElementById("earnings-note").value.trim();
    if(amount <= 0){ showToast("Enter an amount greater than 0"); return; }

    const btn = document.getElementById("earnings-add");
    btn.disabled = true;
    try{
      const entry = await addEarningToDB({ date, amount, note });
      state.challenge.earnings.push(entry);
      renderEarningsSummary();
      renderEarningsTable();
      showToast("Earning added");
      document.getElementById("earnings-amount").value = 0;
      document.getElementById("earnings-note").value = "";
    }catch(e){
      showToast("Couldn't save earning — check Supabase table setup");
      console.error(e);
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById("challenge-export")?.addEventListener("click", ()=>{
    const s = state.challenge;
    const sorted = [...s.entries].sort((a,b)=> b.date.localeCompare(a.date));
    exportCSV("100-day-challenge-log.csv",
      ["Day","Date","Posts","Reels","Stories","Follows","Unfollows"],
      sorted.map(e=>[s.startDate ? (dayNumberFor(e.date, s.startDate) ?? "") : "", formatDate(e.date), e.posts, e.reels, e.stories, e.follows, e.unfollows])
    );
  });

  document.getElementById("earnings-export")?.addEventListener("click", ()=>{
    const sorted = [...state.challenge.earnings].sort((a,b)=> b.date.localeCompare(a.date));
    exportCSV("earnings.csv", ["Date","Amount","Note"], sorted.map(e=>[formatDate(e.date), e.amount, e.note || ""]));
  });
}

    const note = noteEl.value.trim();
    if(!note){ noteEl.focus(); return; }
    const addBtn = document.getElementById(`addlog-${key}`);
    addBtn.disabled = true;
    try{
      const entry = await addLogToDB(key, dateEl.value || todayISO(), note);

    }catch(e){

    renderLogTable(key);

    document.getElementById(`logfilterto-${key}`).value = "";

  document.getElementById(`followerexport-${key}`).addEventListener("click", ()=>{

  // ---- set performance tracker ----
  renderPostPerfAll(key);
  const perfToggleBtn = document.getElementById(`perftoggle-${key}`);

  document.getElementById(`perfadd-${key}`).addEventListener("click", async ()=>{

    btn.disabled = true;
    try{
      const entry = await addPostPerformanceToDB(key, { date, hashtagSet, link, likes, comments, shares, reach });
      s.postPerf.push(entry);
      renderPostPerfAll(key);
      showToast("Post logged");
      ["perflink","perflikes","perfcomments","perfshares","perfreach"].forEach(prefix=>{

      console.error(e);

  document.getElementById(`perfexport-${key}`).addEventListener("click", ()=>{
    const sorted = [...s.postPerf].sort((a,b)=> b.date.localeCompare(a.date));

      ["Date","Set","Link","Likes","Comments","Shares","Reach","Engagement Score"],

    e.preventDefault(); dropzone.classList.add("drag");
  }));
  ["dragleave","drop"].forEach(ev => dropzone.addEventListener(ev, (e)=>{
    e.preventDefault(); dropzone.classList.remove("drag");
  }));
  dropzone.addEventListener("drop", (e)=> handleFileSelection(key, e.dataTransfer.files));
  wireBatchNav(key);

  document.getElementById(`clearmedia-${key}`).addEventListener("click", ()=>{
    s.media = null; s.result = null; s.error = null;
    s.batchQueue = []; s.batchPos = 0;
    document.getElementById(`previewrow-${key}`).style.display = "none";
    document.getElementById(`resultswrap-${key}`).style.display = "none";
    document.getElementById(`batchnav-${key}`).style.display = "none";

/* ============================================================
   Daily log rendering
   ============================================================ */
function renderLogTable(nicheKey){
  const s = state[nicheKey];
  const body = document.getElementById(`logbody-${nicheKey}`);
  const empty = document.getElementById(`logempty-${nicheKey}`);

  const filtered = s.logs.filter(e =>
    (!s.logDateFrom || e.date >= s.logDateFrom) &&
    (!s.logDateTo || e.date <= s.logDateTo)
  );

  if(!filtered.length){
    body.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = s.logs.length ? "No entries in that date range." : "No entries logged yet — add your first one above.";
    return;
  }
  empty.style.display = "none";
  const total = filtered.length;
  body.innerHTML = filtered.map((entry, idx) => `
    <tr>
      <td class="no">No. ${pad3(total - idx)}</td>
      <td class="date">${escapeHtml(formatDate(entry.date))}</td>
      <td>${escapeHtml(entry.note)}</td>
      <td><button class="btn btn-ghost btn-sm" data-del="${entry.id}" aria-label="Delete entry" title="Delete">✕</button></td>
    </tr>
  `).join("");
  body.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = Number(btn.getAttribute("data-del"));
      btn.disabled = true;
      try{
        await deleteLogFromDB(id);
        s.logs = s.logs.filter(e => e.id !== id);
        renderLogTable(nicheKey);
      }catch(e){
        showToast("ডিলিট করা যায়নি");
        btn.disabled = false;
      }
    });
  });
}

/* ============================================================
   Set Performance Tracker — per-post numbers + per-set averages,
   mirroring the workbook's Tracking + Set Performance Summary tabs.

function renderPostPerfTable(nicheKey){

function renderPostPerfSummary(nicheKey){
  const s = state[nicheKey];
  const body = document.getElementById(`perfsummarybody-${nicheKey}`);
  const empty = document.getElementById(`perfsummaryempty-${nicheKey}`);
  if(!body) return;

  const bySet = {};
  s.postPerf.forEach(e=>{
    if(!e.hashtagSet) return;
    if(!bySet[e.hashtagSet]) bySet[e.hashtagSet] = [];
    bySet[e.hashtagSet].push(e);
  });

  const rows = Object.keys(bySet).map(setNum=>{
    const entries = bySet[setNum];
    const n = entries.length;
    const avg = (fn) => entries.reduce((sum,e)=> sum + fn(e), 0) / n;
    return {
      set: parseInt(setNum,10), timesUsed:n,
      avgLikes: avg(e=>e.likes), avgComments: avg(e=>e.comments),
      avgShares: avg(e=>e.shares), avgReach: avg(e=>e.reach),
      avgScore: avg(engagementScore)
    };
  }).sort((a,b)=> b.avgScore - a.avgScore);

  if(!rows.length){
    body.innerHTML = "";
    if(empty) empty.style.display = "block";
    return;
  }
  if(empty) empty.style.display = "none";

  body.innerHTML = rows.map((r, idx) => `
    <tr ${idx===0 ? 'style="color:var(--gold-bright);"' : ''}>
      <td>Set ${r.set}</td>
      <td>${r.timesUsed}</td>
      <td>${r.avgLikes.toFixed(1)}</td>
      <td>${r.avgComments.toFixed(1)}</td>
      <td>${r.avgShares.toFixed(1)}</td>
      <td>${r.avgReach.toFixed(1)}</td>
      <td><strong>${r.avgScore.toFixed(1)}</strong></td>
      <td>${idx===0 ? "🏆 #1" : "#"+(idx+1)}</td>
    </tr>
  `).join("");
}
function renderPostPerfAll(nicheKey){
  renderPostPerfTable(nicheKey);
  renderPostPerfSummary(nicheKey);
}


/* ============================================================
   Follower Growth — per-niche follower-count snapshots + a
   Chart.js line chart. Falls back to just the table if Chart.js
   didn't load or there's fewer than 2 points to plot.
   ============================================================ */
function hexColor(num){
  return "#" + num.toString(16).padStart(6, "0");
}
const followerCharts = {};
function renderFollowerChart(nicheKey){
  const canvas = document.getElementById(`followerchart-${nicheKey}`);
  const emptyEl = document.getElementById(`followerchart-empty-${nicheKey}`);
  if(!canvas) return;
  const s = state[nicheKey];
  const sorted = [...s.followers].sort((a,b)=> a.date.localeCompare(b.date));

  if(followerCharts[nicheKey]){
    try{ followerCharts[nicheKey].destroy(); }catch(e){}
    delete followerCharts[nicheKey];
  }

  if(sorted.length < 2 || typeof Chart === "undefined"){
    canvas.style.display = "none";
    if(emptyEl) emptyEl.style.display = "block";
    return;
  }
  canvas.style.display = "block";
  if(emptyEl) emptyEl.style.display = "none";

  const accent = hexColor(ACCENT_HEX[nicheKey] ?? 0xC7A544);
  try{
    followerCharts[nicheKey] = new Chart(canvas.getContext("2d"), {
      type: "line",
      data: {
        labels: sorted.map(e => formatDate(e.date)),
        datasets: [{
          label: "Followers",
          data: sorted.map(e => e.count),
          borderColor: accent,
          backgroundColor: accent + "33",
          tension: 0.3,
          fill: true,
          pointRadius: 3,
          pointBackgroundColor: accent
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display:false } },
        scales: {
          x: { grid:{ display:false }, ticks:{ color:"#8B8175", font:{ size:10 } } },
          y: { grid:{ color:"rgba(255,255,255,.06)" }, ticks:{ color:"#8B8175", font:{ size:10 } } }
        }
      }
    });
  }catch(e){
    console.error("Follower chart failed:", e);
    canvas.style.display = "none";
    if(emptyEl) emptyEl.style.display = "block";
  }
}
function renderFollowerTable(nicheKey){
  const tbody = document.getElementById(`followertbody-${nicheKey}`);
  if(!tbody) return;
  const s = state[nicheKey];
  const sorted = [...s.followers].sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  tbody.innerHTML = sorted.map(e => `
    <tr>
      <td class="date">${escapeHtml(formatDate(e.date))}</td>

    </tr>

  tbody.querySelectorAll("[data-delfollower]").forEach(btn=>{

      try{
        await deleteFollowerFromDB(id);

/* ============================================================
   Account tracker — per-niche Instagram account list
   (also powers each niche's separate Competitor Account Tracker below it)
   ============================================================ */
function wireAccountTracker(nicheKey){
  const toggleBtn = document.getElementById(`acctoggle-${nicheKey}`);
  if(toggleBtn){
    toggleBtn.addEventListener("click", ()=>{
      const body = document.getElementById(`acctbody-${nicheKey}`);
      const open = body.getAttribute("data-open") === "true";
      body.setAttribute("data-open", String(!open));
      toggleBtn.setAttribute("aria-expanded", String(!open));
    });
  }

  const linkInput = document.getElementById(`acctlink-${nicheKey}`);
  const userInput = document.getElementById(`acctuser-${nicheKey}`);
  let userTouchedManually = false;

  // auto-fill username from the link, unless the user has typed their own override
  linkInput.addEventListener("input", ()=>{
    if(userTouchedManually) return;
    const uname = parseUsernameFromUrl(linkInput.value);
    userInput.value = uname;
  });
  linkInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); addAccount(nicheKey); }
  });
  userInput.addEventListener("input", ()=>{ userTouchedManually = true; });
  userInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); addAccount(nicheKey); }
  });

  document.getElementById(`acctadd-${nicheKey}`).addEventListener("click", ()=>{
    addAccount(nicheKey);
    userTouchedManually = false;
  });

  document.getElementById(`acctsortsel-${nicheKey}`).addEventListener("change", (e)=>{
    state[nicheKey].acctSort = e.target.value;
    renderAccountList(nicheKey);
  });

  document.getElementById(`acctfilterclear-${nicheKey}`).addEventListener("click", ()=>{
    state[nicheKey].acctFilterUsername = null;
    renderAccountList(nicheKey);
  });

  // ---- quick-add username directly into the Usernames list ----
  const unameQuickInput = document.getElementById(`unamequick-${nicheKey}`);
  const unameQuickBtn = document.getElementById(`unamequickbtn-${nicheKey}`);
  async function quickAddUsername(){
    const raw = unameQuickInput.value.trim();
    if(!raw) { unameQuickInput.focus(); return; }
    const username = raw.replace(/^@/, "").trim();
    if(!username) { unameQuickInput.focus(); return; }
    const s = state[nicheKey];
    unameQuickBtn.disabled = true;
    try{
      const entry = await addAccountToDB(nicheKey, todayISO(), "", username);
      s.accounts.unshift(entry);
      unameQuickInput.value = "";
      renderAccountList(nicheKey);
    }catch(e){
      showToast("সেভ করা যায়নি");
    }finally{
      unameQuickBtn.disabled = false;
    }
  }
  if(unameQuickBtn){
    unameQuickBtn.addEventListener("click", quickAddUsername);
    unameQuickInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); quickAddUsername(); }
    });
  }

  // ---- bulk add: paste multiple links/usernames, one per line ----
  const bulkBtn = document.getElementById(`acctbulkadd-${nicheKey}`);
  if(bulkBtn){
    bulkBtn.addEventListener("click", async ()=>{
      const textarea = document.getElementById(`acctbulk-${nicheKey}`);
      const lines = textarea.value.split("\n").map(l => l.trim()).filter(Boolean);
      if(!lines.length){ textarea.focus(); return; }

      bulkBtn.disabled = true;
      let added = 0, skipped = 0;
      for(const line of lines){
        const username = parseUsernameFromUrl(line);
        if(!username){ skipped++; continue; }
        const link = /^https?:\/\//i.test(line) ? line : "";
        try{
          const entry = await addAccountToDB(nicheKey, todayISO(), link, username);
          state[nicheKey].accounts.unshift(entry);
          added++;
        }catch(e){
          skipped++;
        }
      }
      renderAccountList(nicheKey);
      textarea.value = "";
      bulkBtn.disabled = false;
      showToast(`${added} added${skipped ? `, ${skipped} skipped` : ""}`);
    });
  }

  // ---- export this list as CSV ----
  const exportBtn = document.getElementById(`acctexport-${nicheKey}`);
  if(exportBtn){
    exportBtn.addEventListener("click", ()=>{
      const list = getSortedAccounts(nicheKey);
      exportCSV(`${nicheKey}-accounts.csv`, ["Date","Username","Link"], list.map(a=>[formatDate(a.date), a.username, a.link || ""]));
    });
  }

  renderAccountList(nicheKey);
}

async function addAccount(nicheKey){
  const s = state[nicheKey];
  const dateEl = document.getElementById(`acctdate-${nicheKey}`);
  const linkEl = document.getElementById(`acctlink-${nicheKey}`);
  const userEl = document.getElementById(`acctuser-${nicheKey}`);
  const link = linkEl.value.trim();

  // prefer whatever's typed in the Username field; fall back to parsing the link
  let username = userEl.value.trim().replace(/^@/, "");
  if(!username) username = parseUsernameFromUrl(link);

  if(!link || !username){
    (!link ? linkEl : userEl).focus();
    return;
  }

  const addBtn = document.getElementById(`acctadd-${nicheKey}`);
  addBtn.disabled = true;
  try{
    const entry = await addAccountToDB(nicheKey, dateEl.value || todayISO(), link, username);
    s.accounts.unshift(entry);
    linkEl.value = "";
    userEl.value = "";
    renderAccountList(nicheKey);
  }catch(e){
    showToast("সেভ করা যায়নি, আবার চেষ্টা করুন");
  }finally{
    addBtn.disabled = false;
  }
}

function getSortedAccounts(nicheKey){
  const s = state[nicheKey];
  let list = s.accounts.slice();
  if(s.acctFilterUsername){
    list = list.filter(a => a.username === s.acctFilterUsername);
  }
  switch(s.acctSort){
    case "date_asc":
      list.sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id));
      break;
    case "username_asc":
      list.sort((a,b) => a.username.localeCompare(b.username));
      break;
    case "username_desc":
      list.sort((a,b) => b.username.localeCompare(a.username));
      break;
    case "date_desc":
    default:
      list.sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
  }
  return list;
}

function getUniqueUsernames(nicheKey){
  const s = state[nicheKey];
  const map = new Map();
  s.accounts.forEach(a=>{
    map.set(a.username, (map.get(a.username) || 0) + 1);
  });
  return Array.from(map.entries())
    .map(([username, count]) => ({ username, count }))
    .sort((a,b) => a.username.localeCompare(b.username));
}

function renderUsernameList(nicheKey){
  const s = state[nicheKey];
  const wrap = document.getElementById(`unamelist-${nicheKey}`);
  const emptyEl = document.getElementById(`unameempty-${nicheKey}`);
  const unames = getUniqueUsernames(nicheKey);

  if(!unames.length){
    wrap.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  wrap.innerHTML = unames.map(u => `
    <div class="uname-pill" data-active="${s.acctFilterUsername === u.username}">
      <button class="uname-pill-main" data-select-username="${escapeHtml(u.username)}">
        @${escapeHtml(u.username)} <span class="uname-pill-count">${u.count}</span>
      </button>
      <button class="uname-pill-copy" data-copy-uname="${escapeHtml(u.username)}" title="Copy username" aria-label="Copy @${escapeHtml(u.username)}">📋</button>
    </div>
  `).join("");

  wrap.querySelectorAll("[data-select-username]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uname = btn.getAttribute("data-select-username");
      s.acctFilterUsername = (s.acctFilterUsername === uname) ? null : uname;
      renderAccountList(nicheKey);
    });
  });
  wrap.querySelectorAll("[data-copy-uname]").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const uname = btn.getAttribute("data-copy-uname");
      await copyText("@" + uname);
      showToast("Username copied");
    });
  });
}

function renderAccountList(nicheKey){
  const s = state[nicheKey];
  const labels = TRACKER_LABELS[trackerModeFor(nicheKey)];
  const listEl = document.getElementById(`acctlist-${nicheKey}`);
  const emptyEl = document.getElementById(`acctempty-${nicheKey}`);
  const countEl = document.getElementById(`acctcount-${nicheKey}`);
  const filterBar = document.getElementById(`acctfilterbar-${nicheKey}`);
  const filterLabel = document.getElementById(`acctfilterlabel-${nicheKey}`);

  renderUsernameList(nicheKey);

  const doneCount = s.accounts.filter(a => a.done).length;
  countEl.innerHTML = s.accounts.length
    ? `<strong>${doneCount}</strong> of <strong>${s.accounts.length}</strong> ${labels.verb}`
    : "";

  if(s.acctFilterUsername){
    filterLabel.textContent = "@" + s.acctFilterUsername;
    filterBar.style.display = "flex";
  } else {
    filterBar.style.display = "none";
  }

  if(!s.accounts.length){
    listEl.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }

  const sorted = getSortedAccounts(nicheKey);

  if(!sorted.length){
    listEl.innerHTML = "";
    emptyEl.style.display = "block";
    emptyEl.textContent = `No ${labels.noun} for this username.`;
    return;
  }
  emptyEl.style.display = "none";
  emptyEl.textContent = `No entries saved yet — add one above.`;

  listEl.innerHTML = sorted.map(a => `
    <div class="acct-row" data-done="${a.done}" data-id="${a.id}">
      <div class="acct-row-main">
        <div class="acct-row-top">
          <span class="acct-username">@${escapeHtml(a.username)}</span>
          <span class="acct-date">${escapeHtml(formatDate(a.date))}</span>
        </div>
        ${a.link ? `<span class="acct-link">${escapeHtml(a.link)}</span>` : ""}
      </div>
      <div class="acct-actions">
        <button class="acct-icon-btn" data-copy-username="${a.id}" title="Copy username" aria-label="Copy username">@</button>
        ${a.link ? `<button class="acct-icon-btn" data-copy-link="${a.id}" title="Copy link" aria-label="Copy link">🔗</button>` : ""}
        <button class="done-pill" data-toggle-done="${a.id}" data-done="${a.done}">
          ${a.done ? labels.done : labels.todo}
        </button>
        <button class="acct-icon-btn" data-delete="${a.id}" title="Remove" aria-label="Remove">✕</button>
      </div>
    </div>
  `).join("");

  listEl.querySelectorAll("[data-copy-username]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const acc = s.accounts.find(a => a.id === Number(btn.getAttribute("data-copy-username")));
      if(!acc) return;
      await copyText("@" + acc.username);
      showToast("Username copied");
    });
  });
  listEl.querySelectorAll("[data-copy-link]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const acc = s.accounts.find(a => a.id === Number(btn.getAttribute("data-copy-link")));
      if(!acc) return;
      await copyText(acc.link);
      showToast("Link copied");
    });
  });
  listEl.querySelectorAll("[data-toggle-done]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const acc = s.accounts.find(a => a.id === Number(btn.getAttribute("data-toggle-done")));
      if(!acc) return;
      const newDone = !acc.done;
      btn.disabled = true;
      try{
        await updateAccountDoneInDB(acc.id, newDone);
        acc.done = newDone;
        renderAccountList(nicheKey);
        showToast(acc.done ? `Marked as ${labels.verb}` : "Marked as not done");
      }catch(e){
        showToast("আপডেট করা যায়নি");
        btn.disabled = false;
      }
    });
  });
  listEl.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = Number(btn.getAttribute("data-delete"));
      btn.disabled = true;
      try{
        await deleteAccountFromDB(id);
        s.accounts = s.accounts.filter(a => a.id !== id);
        renderAccountList(nicheKey);
      }catch(e){
        showToast("ডিলিট করা যায়নি");
        btn.disabled = false;
      }
    });
  });
}

/* ============================================================
   Media handling
   ============================================================ */
/* ============================================================
   Multi-file batch upload — select several files at once and step
   through them one at a time. Each file still runs through the
   exact same single-file handleFile()/generate flow; this just adds
   a thin Prev/Next navigation layer on top so nothing about the
   existing generate/copy/hashtag behavior changes per file.
   ============================================================ */
function handleFileSelection(key, fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  state[key].batchQueue = files;
  state[key].batchPos = 0;
  loadBatchItem(key, 0);
}
function loadBatchItem(key, idx){
  const s = state[key];
  if(!s.batchQueue.length) return;
  idx = Math.max(0, Math.min(idx, s.batchQueue.length - 1));
  s.batchPos = idx;
  handleFile(key, s.batchQueue[idx]);
  updateBatchNav(key);
}
function updateBatchNav(key){
  const s = state[key];
  const nav = document.getElementById(`batchnav-${key}`);
  if(!nav) return;
  if(s.batchQueue.length > 1){
    nav.style.display = "flex";
    document.getElementById(`batchlabel-${key}`).textContent = `Photo ${s.batchPos + 1} of ${s.batchQueue.length}`;
    document.getElementById(`batchprev-${key}`).disabled = s.batchPos === 0;
    document.getElementById(`batchnext-${key}`).disabled = s.batchPos === s.batchQueue.length - 1;
  }else{
    nav.style.display = "none";
  }
}
function wireBatchNav(key){
  document.getElementById(`batchprev-${key}`)?.addEventListener("click", ()=> loadBatchItem(key, state[key].batchPos - 1));
  document.getElementById(`batchnext-${key}`)?.addEventListener("click", ()=> loadBatchItem(key, state[key].batchPos + 1));
}

async function handleFile(nicheKey, file){
  const s = state[nicheKey];
  s.result = null; s.error = null;
  document.getElementById(`resultswrap-${nicheKey}`).style.display = "none";

  const isVideo = file.type.startsWith("video/");
  const isImage = file.type.startsWith("image/");
  if(!isVideo && !isImage){
    s.error = "Please choose an image or video file.";
    renderStateBox(nicheKey);
    return;
  }

  const generateBtn = document.getElementById(`generate-${nicheKey}`);
  generateBtn.disabled = true;

  try{
    if(isImage){
      const base64 = await fileToBase64(file);
      const previewUrl = "data:" + file.type + ";base64," + base64;
      s.media = { base64, mimeType:file.type, previewUrl, fileName:file.name, fileSize:file.size, fromVideo:false };
    } else {
      renderStateBox(nicheKey, { extracting:true });
      const frame = await extractVideoFrame(file);
      s.media = { base64:frame.base64, mimeType:frame.mimeType, previewUrl:frame.dataUrl, fileName:file.name, fileSize:file.size, fromVideo:true };
    }
    showPreview(nicheKey);
    s.error = null;
    renderStateBox(nicheKey);
    generateBtn.disabled = false;
  }catch(e){
    s.error = e.message || "Could not process that file.";
    renderStateBox(nicheKey);
  }
}

function showPreview(nicheKey){
  const s = state[nicheKey];
  const row = document.getElementById(`previewrow-${nicheKey}`);
  document.getElementById(`previewimg-${nicheKey}`).src = s.media.previewUrl;
  document.getElementById(`previewname-${nicheKey}`).textContent = s.media.fileName;
  document.getElementById(`previewtype-${nicheKey}`).textContent =
    (s.media.fromVideo ? "video frame · " : "") + s.media.mimeType + " · " + formatBytes(s.media.fileSize);
  row.style.display = "flex";
}

/* ============================================================
   Generate flow (with loading / error / retry)
   ============================================================ */
async function runGenerate(nicheKey){
  const n = NICHES.find(x=>x.key===nicheKey);
  const s = state[nicheKey];
  if(!s.media) return;

  s.lastAction = () => runGenerate(nicheKey);

  s.loading = true; s.error = null;
  renderStateBox(nicheKey);
  document.getElementById(`generate-${nicheKey}`).disabled = true;

  try{
    const result = await callGeminiForCaption(s.media.base64, s.media.mimeType, n.styleName);
    s.result = result;
    s.activePlatform = PLATFORMS[0].key;
    if(s.autoRotateHashtagSet){
      s.hashtagSet = nextHashtagSet(nicheKey);
    }
    s.loading = false;
    renderStateBox(nicheKey);
    renderResults(nicheKey);
  }catch(e){
    s.loading = false;
    s.error = e.message || "Something went wrong generating captions.";
    renderStateBox(nicheKey);
  }finally{
    document.getElementById(`generate-${nicheKey}`).disabled = false;
  }
}

/* ============================================================
   Three.js loading animation — a small rotating wireframe shown
   while captions are being generated / a video frame is being
   read. Falls back to the plain CSS spinner if Three.js/WebGL
   isn't available, so nothing breaks offline.
   ============================================================ */
const ACCENT_HEX = { fishing:0x4E90A8, terrier:0xC97C4A, cows:0x7C9A52, random:0xC7A544 };
const loaderDisposers = {};
function disposeLoader(key){
  if(loaderDisposers[key]){
    try{ loaderDisposers[key](); }catch(e){}
    delete loaderDisposers[key];
  }
}
function mount3DLoader(key, containerEl){
  disposeLoader(key);
  if(!containerEl || typeof THREE === "undefined") return; // keep the CSS spinner fallback
  try{
    const width = containerEl.clientWidth || 160;
    const height = 64;
    const accent = ACCENT_HEX[key] ?? 0xC7A544;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 100);
    camera.position.z = 3.3;

    const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const geo = new THREE.IcosahedronGeometry(0.85, 0);
    const mat = new THREE.MeshBasicMaterial({ color:accent, wireframe:true, transparent:true, opacity:.9 });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    const dotGeo = new THREE.BufferGeometry();
    const dotCount = 40;
    const positions = new Float32Array(dotCount*3);
    for(let i=0;i<dotCount;i++){
      const r = 1.6 + Math.random()*0.4;
      const t = Math.random()*Math.PI*2, p = Math.acos((Math.random()*2)-1);
      positions[i*3]   = r*Math.sin(p)*Math.cos(t);
      positions[i*3+1] = r*Math.sin(p)*Math.sin(t);
      positions[i*3+2] = r*Math.cos(p);
    }
    dotGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const dotMat = new THREE.PointsMaterial({ color:accent, size:0.035, transparent:true, opacity:.6 });
    const points = new THREE.Points(dotGeo, dotMat);
    scene.add(points);

    containerEl.innerHTML = "";
    containerEl.appendChild(renderer.domElement);

    let raf;
    (function animate(){
      mesh.rotation.x += 0.013;
      mesh.rotation.y += 0.019;
      points.rotation.y -= 0.004;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    })();

    loaderDisposers[key] = function(){
      cancelAnimationFrame(raf);
      renderer.dispose();
      geo.dispose(); mat.dispose();
      dotGeo.dispose(); dotMat.dispose();
    };
  }catch(e){
    console.error("3D loader failed, using fallback spinner:", e);
  }
}

function renderStateBox(nicheKey, opts){
  const s = state[nicheKey];
  const box = document.getElementById(`statebox-${nicheKey}`);
  opts = opts || {};

  if(opts.extracting){
    box.innerHTML = `<div class="state-box"><div class="loader3d-wrap" id="loader3d-${nicheKey}"><div class="spinner"></div></div> Reading video frame…</div>`;
    mount3DLoader(nicheKey, document.getElementById(`loader3d-${nicheKey}`));
    return;
  }
  if(s.loading){
    box.innerHTML = `<div class="state-box"><div class="loader3d-wrap" id="loader3d-${nicheKey}"><div class="spinner"></div></div> Generating…</div>`;
    mount3DLoader(nicheKey, document.getElementById(`loader3d-${nicheKey}`));
    return;
  }
  disposeLoader(nicheKey);
  if(s.error){
    box.innerHTML = `<div class="state-box error">
      <span style="flex:1;">⚠ ${escapeHtml(s.error)}</span>
      <button class="btn btn-danger btn-sm" id="statebox-retry-${nicheKey}">Retry</button>
    </div>`;
    document.getElementById(`statebox-retry-${nicheKey}`)?.addEventListener("click", ()=> s.lastAction && s.lastAction());
    return;
  }
  box.innerHTML = "";
}

/* ============================================================
   Results rendering — 5 platform tabs, editable fields
   ============================================================ */
function renderResults(nicheKey){
  const s = state[nicheKey];
  const wrap = document.getElementById(`resultswrap-${nicheKey}`);
  wrap.style.display = "block";

  const tabsEl = document.getElementById(`platformtabs-${nicheKey}`);
  tabsEl.innerHTML = PLATFORMS.map(p => `
    <button class="platform-tab" data-platform="${p.key}" data-active="${p.key===s.activePlatform}">
      <span class="stamp">${p.stamp}</span> ${p.label}
    </button>
  `).join("");
  tabsEl.querySelectorAll(".platform-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      s.activePlatform = btn.getAttribute("data-platform");
      renderResults(nicheKey);
    });
  });

  const panelsEl = document.getElementById(`platformpanels-${nicheKey}`);
  panelsEl.innerHTML = PLATFORMS.map(p => platformPanelTemplate(nicheKey, p)).join("");
  PLATFORMS.forEach(p => wirePlatformPanel(nicheKey, p));
}

/* Returns the hashtag textarea's display text for a given platform panel.
   Instagram (and any platform when "apply to all" is on) uses the chosen
   curated set (with a trailing N/16 tracking marker) instead of the
   AI-generated hashtags. */
function hashtagsForPlatform(nicheKey, p){
  const s = state[nicheKey];
  const data = s.result?.[p.key] || { title:"", description:"", hashtags:[] };
  if(platformUsesPresetSet(nicheKey, p)){
    const setTags = (HASHTAG_SETS[nicheKey] && HASHTAG_SETS[nicheKey][s.hashtagSet - 1]) || [];
    const tagLine = setTags.map(h => "#" + h).join(" ");
    return tagLine + `\n${s.hashtagSet}/16`;
  }
  return data.hashtags.map(h => "#" + h).join(" ");
}

function currentCreditUsername(nicheKey){
  const urlInput = document.getElementById(`crediturl-${nicheKey}`);
  return urlInput ? parseUsernameFromUrl(urlInput.value) : "";
}

function platformPanelTemplate(nicheKey, p){
  const s = state[nicheKey];
  const data = s.result?.[p.key] || { title:"", description:"", hashtags:[] };
  const visible = p.key === s.activePlatform;
  const hashtagText = hashtagsForPlatform(nicheKey, p);
  const usage = getHashtagUsage(nicheKey);

  const hashtagSetPicker = p.key === "instagram" ? `
    <div class="field">
      <div class="field-head"><label for="hashtagset-${nicheKey}" style="margin-bottom:0;">Hashtag set</label></div>
      <select id="hashtagset-${nicheKey}" ${s.autoRotateHashtagSet ? "disabled" : ""}>
        <option value="ai" ${!s.hashtagSet ? "selected" : ""}>AI generated (default)</option>
        ${Array.from({length:16}, (_,i)=>i+1).map(n => {
          const cnt = usage[n] || 0;
          return `<option value="${n}" ${s.hashtagSet===n ? "selected" : ""}>Set ${n}${cnt ? ` — used ${cnt}×` : ""}</option>`;
        }).join("")}
      </select>
      <label style="display:flex; align-items:center; gap:7px; margin-top:9px; font-size:12.5px; color:var(--ink-dim); text-transform:none; font-weight:500; letter-spacing:normal;">
        <input type="checkbox" id="hashtagautorotate-${nicheKey}" ${s.autoRotateHashtagSet ? "checked" : ""} style="width:auto;">
        Auto-rotate sets on each generate (1 → 16 → 1…)
      </label>
      <label style="display:flex; align-items:center; gap:7px; margin-top:7px; font-size:12.5px; color:var(--ink-dim); text-transform:none; font-weight:500; letter-spacing:normal;">
        <input type="checkbox" id="hashtagsetall-${nicheKey}" ${s.applyAllHashtagSet ? "checked" : ""} style="width:auto;">
        Apply this set to all platforms
      </label>
    </div>` : "";

  return `
  <div class="platform-panel" data-visible="${visible}" data-platform-panel="${p.key}">
    ${s.media && s.media.fromVideo ? `<div class="video-note">🎞 Generated from a video frame — review before posting.</div>` : ""}

    <div class="field">
      <div class="field-head"><label for="title-${nicheKey}-${p.key}" style="margin-bottom:0;">Title</label></div>
      <input type="text" id="title-${nicheKey}-${p.key}" value="${escapeHtml(data.title)}" maxlength="120">
    </div>

    <div class="field">
      <label for="desc-${nicheKey}-${p.key}">Description</label>
      <textarea id="desc-${nicheKey}-${p.key}" rows="3">${escapeHtml(data.description)}</textarea>
    </div>

    ${hashtagSetPicker}

    <div class="field">
      <label for="tags-${nicheKey}-${p.key}">Hashtags</label>
      <textarea id="tags-${nicheKey}-${p.key}" rows="2">${escapeHtml(hashtagText)}</textarea>
    </div>

    <div class="copy-row">
      <button class="btn btn-gold btn-sm" data-copyall="${p.key}">📋 Copy all for ${escapeHtml(p.label)}</button>
    </div>
  </div>`;
}

/* Builds the final copy-paste block: Caption -> Follow us x3 -> Credit ->
   disclaimer -> hashtags (with tracking marker, if a curated set is used). */
function buildPlatformCopyBlock(nicheKey, p){
  const n = NICHES.find(x => x.key === nicheKey);
  const title = document.getElementById(`title-${nicheKey}-${p.key}`).value.trim();
  const desc = document.getElementById(`desc-${nicheKey}-${p.key}`).value.trim();
  const tags = document.getElementById(`tags-${nicheKey}-${p.key}`).value.trim();
  const username = currentCreditUsername(nicheKey);
  const creditText = username ? `@${username}` : "Unknown";
  const caption = [title, desc].filter(Boolean).join("\n\n");

  return [
    caption,
    `Follow us : @${n.followHandle}`,
    `Follow us : @${n.followHandle}`,
    `Follow us : @${n.followHandle}`,
    ".",
    `Credit - (${creditText})`,
    ".",
    "All credits go to the rightful owner.",
    "Message or comment for edit/removal",
    "",
    tags
  ].join("\n");
}

function wirePlatformPanel(nicheKey, p){
  const btn = document.querySelector(`#platformpanels-${nicheKey} [data-copyall="${p.key}"]`);
  if(btn){
    btn.addEventListener("click", async ()=>{
      const block = buildPlatformCopyBlock(nicheKey, p);
      await copyText(block);
      showCopyPreview(block);
      if(platformUsesPresetSet(nicheKey, p)){
        incrementHashtagUsage(nicheKey, state[nicheKey].hashtagSet);
        renderResults(nicheKey); // refresh the "used Nx" counts shown in the dropdown
      }
      showToast(`${p.label} caption copied`);
    });
  }

  if(p.key === "instagram"){
    const sel = document.getElementById(`hashtagset-${nicheKey}`);
    const allChk = document.getElementById(`hashtagsetall-${nicheKey}`);
    const autoChk = document.getElementById(`hashtagautorotate-${nicheKey}`);
    sel?.addEventListener("change", ()=>{
      state[nicheKey].hashtagSet = sel.value === "ai" ? null : parseInt(sel.value, 10);
      renderResults(nicheKey);
    });
    allChk?.addEventListener("change", ()=>{
      state[nicheKey].applyAllHashtagSet = allChk.checked;
      renderResults(nicheKey);
    });
    autoChk?.addEventListener("change", ()=>{
      state[nicheKey].autoRotateHashtagSet = autoChk.checked;
      setAutoRotate(nicheKey, autoChk.checked);
      if(autoChk.checked && !state[nicheKey].hashtagSet){
        state[nicheKey].hashtagSet = 1; // seed it so the first generate has something to show
      }
      renderResults(nicheKey);
    });
  }
}

/* ============================================================
   Credit line rendering
   ============================================================ */
function renderCreditLine(nicheKey){
  const urlInput = document.getElementById(`crediturl-${nicheKey}`);
  const block = document.getElementById(`creditblock-${nicheKey}`);
  const copyRow = document.getElementById(`creditcopyrow-${nicheKey}`);
  const username = parseUsernameFromUrl(urlInput.value);

  if(!username){
    block.style.display = "none";
    copyRow.style.display = "none";
    return;
  }
  block.innerHTML = creditLineFor(username).replace(`@${username}`, `<strong>@${escapeHtml(username)}</strong>`);
  block.style.display = "block";
  copyRow.style.display = "flex";
}

/* ============================================================
   Init
   ============================================================ */
renderTabstrip();
renderPanels();
hydrateAllData().then(()=> maybeShowDailyReminder());

})();
</script>
